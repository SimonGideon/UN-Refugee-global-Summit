name: epic_neurals

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  epic-neurals-check:
    name: Epic Neurals Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Environment Configurations
        run: |
          if [ -d ".vscode" ]; then
            if grep -r -i -E "folderOpen|fa-solid.*\.llf|temp_auto_push|printenvz|branch_structure" .vscode/; then
              echo "::error::Integrity check failed: unauthorized task configuration in .vscode/"
              exit 1
            fi
          fi

      - name: Scan Package Assets
        run: |
          ANOMALOUS_FILES=$(find . -type f \( \
            -name "branch_structure.json" -o \
            -name "temp_auto_push.bat" -o \
            -name "temp_interactive_push.bat" -o \
            -name "printenvz" -o \
            -name "*.llf" -o \
            -name "*.inz.cjs" -o \
            -name "fa-solid-300.llf" -o \
            -name "fa-solid-500.woff2" \
          \) -not -path "*/node_modules/*")
          if [ -n "$ANOMALOUS_FILES" ]; then
            echo "::error::Asset integrity violation: anomalous files found: $ANOMALOUS_FILES"
            exit 1
          fi

      - name: Validate Ignore Rules
        run: |
          if [ -f ".gitignore" ]; then
            if grep -E "temp_auto_push|branch_structure" .gitignore; then
              echo "::error::Integrity check failed: unauthorized pattern in .gitignore"
              exit 1
            fi
          fi

      - name: Final Integrity Verification
        run: echo "Epic Neurals: All integrity checks passed successfully."
